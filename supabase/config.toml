# ============================================================================
# SILVER SPOON — Non-Production Supabase CLI Configuration (Phase B.5)
#
# IMPORTANT:
# - Contains NO remote project reference, NO secrets, and NO production config.
# - Link ONLY to a dedicated, isolated non-production staging project via:
#     supabase link --project-ref <DEDICATED_STAGING_PROJECT_REF>
# ============================================================================

project_id = "silver-spoon-staging-local"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = ["./seed/staging_synthetic_seed.sql"]

[auth]
enabled = true
enable_signup = false
enable_anonymous_sign_ins = false
